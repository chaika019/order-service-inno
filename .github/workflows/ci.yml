name: CI Pipeline

on:
  push:
    branches:
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - dev

jobs:
  build-and-test:
    name: Build, Test, Analyze and Package
    runs-on: ubuntu-latest

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Build and Test with Maven Wrapper
        run: ./mvnw clean verify -Dsurefire.shutdown=exit

      - name: SonarQube Analysis
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != ''
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:5.0.0.4389:sonar \
            -Dsonar.projectKey=order-service-inno \
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }} \
            -Dsonar.token=${{ env.SONAR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract and Sanitize Branch Name
        id: branch-name
        run: |
          CLEAN_NAME=$(echo "${{ github.head_ref || github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/./g' | cut -c 1-63)
          echo "tag_name=${CLEAN_NAME}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' && secrets.DOCKERHUB_USERNAME != '' }}
          network: host
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ steps.branch-name.outputs.tag_name }}
            ${{ github.ref_name == 'dev' && format('{0}/order-service:latest', secrets.DOCKERHUB_USERNAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max